<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library App - User Info</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-r from-indigo-700 via-purple-700 to-pink-700 flex items-center justify-center">
    <div class="bg-white bg-opacity-90 backdrop-blur-md p-10 rounded-xl shadow-xl max-w-md w-full">
        <div class="flex flex-col items-center mb-8">
            <img 
              src="https://randomuser.me/api/portraits/men/32.jpg" 
              alt="User Profile" 
              class="w-32 h-32 rounded-full border-4 border-indigo-700 mb-4 shadow-lg hover:scale-105 transition-transform duration-300"
            />
            <h2 class="text-3xl font-extrabold text-indigo-900 mb-1">John Smith</h2>
            <p class="text-indigo-700 font-semibold mb-4">Senior Librarian</p>
        </div>
        <ul class="text-indigo-900 space-y-4 mb-8">
            <li class="flex justify-between border-b border-indigo-300 pb-2">
                <span class="font-medium">Email:</span>
                <span>john.smith@libraryapp.com</span>
            </li>
            <li class="flex justify-between border-b border-indigo-300 pb-2">
                <span class="font-medium">Phone:</span>
                <span>+1 (555) 987-6543</span>
            </li>
            <li class="flex justify-between border-b border-indigo-300 pb-2">
                <span class="font-medium">Location:</span>
                <span>Melbourne, Australia</span>
            </li>
            <li class="flex justify-between border-b border-indigo-300 pb-2">
                <span class="font-medium">Member since:</span>
                <span>March 2018</span>
            </li>
        </ul>
        <div class="flex gap-4">
            <button 
              class="flex-1 bg-indigo-700 text-white py-3 rounded-lg font-semibold hover:bg-indigo-800 transition"
            >
                Message
            </button>
            <button 
              class="flex-1 bg-pink-600 text-white py-3 rounded-lg font-semibold hover:bg-pink-700 transition"
            >
                Follow
            </button>
        </div>
    </div>
</body>
</html>
