<!DOCTYPE html>
<html lang="en" >
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library App - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-r from-indigo-700 via-purple-700 to-pink-700 flex items-center justify-center">
    <div class="bg-white bg-opacity-90 backdrop-blur-md p-10 rounded-xl shadow-xl max-w-md w-full">
        <div class="mb-8 text-center">
        <h1 class="text-4xl font-extrabold text-indigo-900 mb-2">Library App</h1>
        <p class="text-indigo-700 font-semibold">Welcome back! Please login to continue</p>
        </div>
        <form>
        <div class="mb-5">
            <label for="email" class="block text-indigo-900 font-medium mb-2">Email</label>
            <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="you@example.com" 
            class="w-full px-4 py-2 border border-indigo-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
        </div>
        <div class="mb-7">
            <label for="password" class="block text-indigo-900 font-medium mb-2">Password</label>
            <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="********" 
            class="w-full px-4 py-2 border border-indigo-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
        </div>
        <button 
            type="submit" 
            class="w-full bg-indigo-700 text-white py-3 rounded-lg font-semibold hover:bg-indigo-800 transition"
        >
            Sign In
        </button>
        </form>
    </div>
</body>
</html>
